name: Bootstrap source tree

on:
  push:
    branches: [sync/full-source-tree]

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f 'BusinessNotes-GitHub-ready.zip'
          rm -rf /tmp/businessnotes-source
          mkdir -p /tmp/businessnotes-source
          unzip -q 'BusinessNotes-GitHub-ready.zip' -d /tmp/businessnotes-source
          cp -a /tmp/businessnotes-source/. .
          rm -f 'BusinessNotes-GitHub-ready.zip' 'BusinessNotes-GitHub-ready (1).zip'
          rm -f '.github/workflows/bootstrap-extract.yml'

      - name: Commit extracted source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Extract BusinessNotes source tree'
          git push origin "HEAD:${GITHUB_REF_NAME}"
